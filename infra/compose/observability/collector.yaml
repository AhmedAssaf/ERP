# Elastic Distribution of the OpenTelemetry Collector (EDOT 9.5.4) for W-10 (spec O-3, O-4): OTLP in, Elasticsearch out.
# EDOT replaced the contrib 0.161.0 image on 2026-10-02 because only EDOT carries the elasticapm processor and
# connector, which Kibana's APM views need for OTel-native traces (spec O-4, ADR-0014). Every other component below is
# the upstream contrib one.
# The hosts redact before export (spec 7.1); the attributes step here is the second net (O-3).

extensions:
  health_check:
    # Inside the Compose network; the host reaches it on 127.0.0.1:13133 (worker Telemetry check, F-60).
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  # Aggregates spans (and log records) into the APM summary metrics Kibana's service inventory, transaction and
  # dependency views read: metrics-{service_summary,service_transaction,transaction,service_destination}.{1m,10m,60m}.otel-default.
  # Those streams use Elasticsearch's built-in templates, which compose metrics-otel@custom, so the waslabid-metrics
  # retention covers them (elastic-setup.sh). Aggregation state is in memory.
  elasticapm: {}

processors:
  # First in every pipeline. It measures the Go heap; the container limit (320 MB, docker-compose.yml, spec section 9)
  # also holds about 110 MB of non-heap memory of the EDOT process, so the heap may reach 180 MB (soft limit 144 MB).
  memory_limiter:
    check_interval: 1s
    limit_mib: 180
    spike_limit_mib: 36

  # Second net for what must never be stored: query strings, request headers and the user agent (O-11), and Npgsql's data
  # source name, a connection string (host and user) when the data source has no name (W-10 final fix wave).
  attributes/drop-risky:
    actions:
      - key: url.query
        action: delete
      - key: user_agent.original
        action: delete
      - pattern: ^http\.request\.header\..*
        action: delete
      - key: db.npgsql.data_source
        action: delete

  # Second net for metrics (the hosts drop the attribute with a metric view): Npgsql's pool name is kept only when it is one of
  # the hosts' own data source names (Platform.Shared.Data.DataSourceNames, all "platform-..."), never a connection string.
  transform/pool-name:
    error_mode: ignore
    metric_statements:
      - statements:
          - delete_key(datapoint.attributes, "db.client.connection.pool.name") where datapoint.attributes["db.client.connection.pool.name"] != nil and not IsMatch(datapoint.attributes["db.client.connection.pool.name"], "^platform-[a-z-]+$")

  # Pentest F-OBS-08 (accepted for the pilot, ADR-0014: OTLP is loopback-only and unauthenticated): the Elasticsearch
  # exporter routes a document by the data_stream.* (and elasticsearch.index) attributes of its record (a span event too),
  # scope or resource, which would let any local sender create streams outside the retention policies. They are removed everywhere, so every
  # document lands in the logs-, traces- or metrics-generic.otel-default streams the ILM policies cover.
  transform/strip-routing:
    error_mode: ignore
    trace_statements:
      - statements:
          - delete_matching_keys(resource.attributes, "^(data_stream[.].*|elasticsearch[.]index)$")
      - statements:
          - delete_matching_keys(scope.attributes, "^(data_stream[.].*|elasticsearch[.]index)$")
      - statements:
          - delete_matching_keys(span.attributes, "^(data_stream[.].*|elasticsearch[.]index)$")
      # In otel mode the exporter writes each span event as a logs-* document routed by the event's own attributes.
      - statements:
          - delete_matching_keys(spanevent.attributes, "^(data_stream[.].*|elasticsearch[.]index)$")
    log_statements:
      - statements:
          - delete_matching_keys(resource.attributes, "^(data_stream[.].*|elasticsearch[.]index)$")
      - statements:
          - delete_matching_keys(scope.attributes, "^(data_stream[.].*|elasticsearch[.]index)$")
      - statements:
          - delete_matching_keys(log.attributes, "^(data_stream[.].*|elasticsearch[.]index)$")
    metric_statements:
      - statements:
          - delete_matching_keys(resource.attributes, "^(data_stream[.].*|elasticsearch[.]index)$")
      - statements:
          - delete_matching_keys(scope.attributes, "^(data_stream[.].*|elasticsearch[.]index)$")
      - statements:
          - delete_matching_keys(datapoint.attributes, "^(data_stream[.].*|elasticsearch[.]index)$")

  # Enriches spans with the fields Kibana's APM UI reads (processor.event, transaction.*, span.*, event.outcome,
  # service.target.*). Runs after the two redaction steps, so it only sees what may be stored.
  elasticapm: {}

exporters:
  elasticsearch:
    endpoint: http://elasticsearch:9200
    # Least privilege: auto_configure and create_doc on logs-*, traces-*, metrics-* only (elastic-setup.sh).
    user: waslabid_collector
    password: ${env:ELASTIC_COLLECTOR_PASSWORD}
    # OTel-native mapping only (O-4). In 0.161.0 `mapping::mode` is deprecated and ignored; `allowed_modes` with the
    # single entry otel makes it the default and refuses any other mode a client asks for (X-Elastic-Mapping-Mode
    # metadata or the elastic.mapping.mode scope attribute).
    mapping:
      allowed_modes: [otel]
    # Never echo document sources in bulk error responses into the collector's log (N-10).
    include_source_on_error: false
    # Batching is the exporter's own sending queue (the exporter's recommended way since the batch processor was
    # replaced by exporterhelper batching); these are its defaults, written out so they are visible.
    sending_queue:
      enabled: true
      sizer: requests
      queue_size: 10
      num_consumers: 10
      batch:
        flush_timeout: 10s
        sizer: bytes
        min_size: 1000000
        max_size: 5000000

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop-risky, transform/strip-routing, elasticapm]
      exporters: [elasticapm, elasticsearch]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop-risky, transform/strip-routing]
      exporters: [elasticapm, elasticsearch]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/pool-name, transform/strip-routing]
      exporters: [elasticsearch]
    # The connector's output only: no sender reaches this pipeline, and its input already passed drop-risky and
    # strip-routing above. strip-routing is deliberately absent here: the connector sets data_stream.dataset itself
    # (service_summary.1m and the like), which is how the summaries reach the streams the APM UI reads; all of them
    # match metrics-*.otel-* and so the waslabid-metrics retention (F-OBS-08 still holds).
    metrics/aggregated-otel-metrics:
      receivers: [elasticapm]
      processors: [memory_limiter]
      exporters: [elasticsearch]
