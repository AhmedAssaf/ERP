# Local development infrastructure for the tender-to-PO platform.
# The .NET app itself runs on the host (dotnet run / dotnet watch) for hot reload; everything it depends on runs here.
# Usage:  cp .env.example .env   then   docker compose up -d
# See docs/07-ways-of-working.md section 4 for ports, credentials, and the reset procedure.

name: erp-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: erp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_dev_password}
      POSTGRES_DB: platform
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: erp-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-erp}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-erp_dev_password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_FEATURES: organization
      KC_HEALTH_ENABLED: "true"
      # Substituted into keycloak/import/waslabid-realm.json and waslabid-platform-realm.json at import. Values live in
      # .env, never in the repository (N-10).
      WASLABID_WEB_CLIENT_SECRET: ${WASLABID_WEB_CLIENT_SECRET:?Set WASLABID_WEB_CLIENT_SECRET in infra/compose/.env}
      WASLABID_PLATFORM_CLIENT_SECRET: ${WASLABID_PLATFORM_CLIENT_SECRET:?Set WASLABID_PLATFORM_CLIENT_SECRET in infra/compose/.env}
      WASLABID_DEV_USER_PASSWORD: ${WASLABID_DEV_USER_PASSWORD:?Set WASLABID_DEV_USER_PASSWORD in infra/compose/.env}
      WASLABID_ADMIN_API_SECRET: ${WASLABID_ADMIN_API_SECRET:?Set WASLABID_ADMIN_API_SECRET in infra/compose/.env}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
      - "9000:9000"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The management port answers /health/ready; the image has no curl, so use bash's /dev/tcp trick.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO stopped publishing free images on quay.io and Docker Hub; Chainguard rebuilds it from source (MinIO
    # RELEASE.2026-09-22T19-25-18Z). Only its latest tag is free, so it is pinned by digest. It runs as root because
    # the image's non-root user cannot initialise the data directory ("file access denied"), as the old image did.
    image: cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    user: "0:0"
    container_name: erp-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-erp_dev_password}
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    # One-shot: creates the dev bucket, a least-privilege health-probe user (list-only, spec section 6) and the
    # lifecycle rule that expires upload staging after 2 days (vendor spec V-9), then exits.
    # The -dev variant carries the shell the entrypoint below needs.
    image: cgr.dev/chainguard/minio-client@sha256:fdb40d819ca51969c86fa76f45a67bb841759daf85d4c6ce9aa86d27f6e47ae9
    container_name: erp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-erp} ${MINIO_ROOT_PASSWORD:-erp_dev_password} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-erp-dev} &&
      mc admin user add local health-probe ${MINIO_HEALTH_PROBE_PASSWORD:?set MINIO_HEALTH_PROBE_PASSWORD in infra/compose/.env} &&
      printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::${STORAGE_BUCKET:-erp-dev}\"]}]}' > /tmp/health-probe-policy.json &&
      mc admin policy create local health-probe-read /tmp/health-probe-policy.json &&
      mc admin policy attach local health-probe-read --user health-probe &&
      printf '%s' '{\"Rules\":[{\"ID\":\"expire-staging\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"staging/\"},\"Expiration\":{\"Days\":2}}]}' | mc ilm import local/${STORAGE_BUCKET:-erp-dev} &&
      echo 'bucket ready: ${STORAGE_BUCKET:-erp-dev}'"

  clamav:
    image: clamav/clamav:stable
    container_name: erp-clamav
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s   # first start downloads the signature database

  mailpit:
    # Catches all outgoing email; web UI shows Arabic and English messages as vendors would see them.
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    container_name: erp-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  caddy:
    # Edge for local development: terminates TLS for tenant hostnames and forwards to the app on the host.
    # Production uses the same image with on-demand TLS (see caddy/Caddyfile comments).
    image: caddy:2
    container_name: erp-caddy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # W-10 observability (ADR-0014): the hosts send OTLP to the collector, which writes logs, traces and metrics to
  # Elasticsearch in the OTel-native mapping; Kibana is the UI, opt-in through the profile `kibana` (spec O-17).
  # Every port binds to 127.0.0.1 only (O-13). Passwords come from .env (N-10); none appears in a command line,
  # a health check or a log line. Images are pinned by version and multi-architecture index digest (amd64 and arm64,
  # the pilot is arm64). Elastic 9.5.4 is the fix release of ESA-2026-176/179/180/182/183 (2026-09-25); 9.5.5 is not
  # on docker.elastic.co yet. The collector is EDOT (Elastic's OpenTelemetry Collector distribution) of the same 9.5.4
  # release since 2026-10-02 (ADR-0014): contrib 0.161.0 has no elasticapm processor or connector, which Kibana's APM
  # views need for OTel-native traces.
  # Elasticsearch needs vm.max_map_count >= 262144 on the Docker host (docs/07 section 4).

  otel-collector:
    image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.4@sha256:0597fe7cad118fcaee15a8691088eff7b60fdd1501bd84fc91b90066d79c9afd
    container_name: erp-otel-collector
    # The image's entrypoint is `elastic-agent otel`: standalone, no Fleet enrolment, nothing leaves the Compose network.
    command: ["--config=/etc/edot/collector.yaml"]
    # 320 MB since EDOT (2026-10-02; 256 MB with contrib): about 145 MB at idle and 196 MB at 50 requests a second,
    # mostly the larger binary and the elasticapm connector's in-memory aggregation. memory_limiter: 180 MB heap.
    mem_limit: 320m
    environment:
      ELASTIC_COLLECTOR_PASSWORD: ${ELASTIC_COLLECTOR_PASSWORD:?Set ELASTIC_COLLECTOR_PASSWORD in infra/compose/.env}
      # The Go runtime's soft limit under the 320 MB container limit: garbage collection tightens before the kernel's OOM
      # killer acts (memory_limiter at 180 MiB still refuses data first).
      GOMEMLIMIT: 250MiB
    ports:
      - "127.0.0.1:4317:4317"     # OTLP gRPC
      - "127.0.0.1:4318:4318"     # OTLP HTTP
      - "127.0.0.1:13133:13133"   # health_check extension, read by the worker's Telemetry check (F-60)
    volumes:
      - ./observability/collector.yaml:/etc/edot/collector.yaml:ro
    depends_on:
      elastic-setup:
        condition: service_completed_successfully
    healthcheck:
      # The health_check extension; the worker's Telemetry check reads the same endpoint from the host (F-60).
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4@sha256:82ac14f43fe701992e601f4cc81e1c0d7dbc5a2576d8cd736006452925df4026
    container_name: erp-elasticsearch
    # 1.75 GB with the heap kept at 768 MB (2026-10-02): at 1.5 GB the container idled at about 96 % of its limit; the
    # headroom is page cache and off-heap memory (Lucene's memory-mapped files), not more heap.
    mem_limit: 1792m
    environment:
      discovery.type: single-node
      # Direct memory defaults to half the heap (384 MB) on top of it; Elasticsearch uses heap buffers for HTTP, so
      # its direct pool stays small (23 MB at idle). 128 MB caps it so heap, non-heap and direct stay well under the
      # limit during bulk indexing instead of being OOM-killed (exit 137).
      ES_JAVA_OPTS: "-Xms768m -Xmx768m -XX:MaxDirectMemorySize=128m"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      # Bootstrap password of the built-in elastic user; read only on the first start of an empty data volume.
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in infra/compose/.env}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      # No credentials: 401 from the security layer means the node is up and serving HTTP.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9200/ | grep -qE '^(200|401)$'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  elastic-setup:
    # One-shot, idempotent: kibana_system password, roles, users, lifecycle policies (observability/elastic-setup.sh).
    # Runs again on every `up -d`.
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4@sha256:82ac14f43fe701992e601f4cc81e1c0d7dbc5a2576d8cd736006452925df4026
    container_name: erp-elastic-setup
    restart: "no"
    entrypoint: ["bash", "/setup/elastic-setup.sh"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in infra/compose/.env}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD in infra/compose/.env}
      KIBANA_STAFF_USER: ${KIBANA_STAFF_USER:?Set KIBANA_STAFF_USER in infra/compose/.env}
      KIBANA_STAFF_PASSWORD: ${KIBANA_STAFF_PASSWORD:?Set KIBANA_STAFF_PASSWORD in infra/compose/.env}
      ELASTIC_MONITOR_PASSWORD: ${ELASTIC_MONITOR_PASSWORD:?Set ELASTIC_MONITOR_PASSWORD in infra/compose/.env}
      ELASTIC_COLLECTOR_PASSWORD: ${ELASTIC_COLLECTOR_PASSWORD:?Set ELASTIC_COLLECTOR_PASSWORD in infra/compose/.env}
      TELEMETRY_LOGS_RETENTION: ${TELEMETRY_LOGS_RETENTION:?Set TELEMETRY_LOGS_RETENTION in infra/compose/.env}
      TELEMETRY_TRACES_RETENTION: ${TELEMETRY_TRACES_RETENTION:?Set TELEMETRY_TRACES_RETENTION in infra/compose/.env}
      TELEMETRY_METRICS_RETENTION: ${TELEMETRY_METRICS_RETENTION:?Set TELEMETRY_METRICS_RETENTION in infra/compose/.env}
    volumes:
      - ./observability/elastic-setup.sh:/setup/elastic-setup.sh:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4@sha256:b1b4cea273350ffcb67292d7b90dd034598c1627bfa3cd0783315e9237dbe737
    container_name: erp-kibana
    profiles: [kibana]
    # Kibana 9.5.4 does not start with the spec's 512 MB heap or 768 MB limit (V8 heap out of memory at about 500 MB
    # during plugin start, 2026-10-02; also with a 640 MB heap). 768 MB heap starts and serves the dashboards at about
    # 990 MB resident; the limit leaves room for that plus page cache. Spec section 9 to follow (task 9, the user).
    mem_limit: 1280m
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"
      SERVER_PUBLICBASEURL: http://127.0.0.1:5601
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD in infra/compose/.env}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Set KIBANA_ENCRYPTION_KEY in infra/compose/.env}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Set KIBANA_ENCRYPTION_KEY in infra/compose/.env}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Set KIBANA_ENCRYPTION_KEY in infra/compose/.env}
      # Nothing about usage goes to Elastic (data residency, N-01).
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"
      NEWSFEED_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
      elastic-setup:
        condition: service_completed_successfully
    healthcheck:
      # No credentials: 200 or 401 from /api/status means Kibana is up (503 while it starts).
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -qE '^(200|401)$'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  kibana-setup:
    # One-shot, idempotent: imports the "WaslaBid usage" dashboard (overwrite), so the NDJSON in the repository is
    # the source of truth. Imports as elastic: the staff user's viewer role cannot write saved objects (the import
    # answers 403, as spec 6.7 intends). Credentials go to curl through stdin (-K -), never on a command line.
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    container_name: erp-kibana-setup
    profiles: [kibana]
    restart: "no"
    entrypoint: ["sh", "/setup/kibana-setup.sh"]
    environment:
      KIBANA_IMPORT_USER: elastic
      KIBANA_IMPORT_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in infra/compose/.env}
    volumes:
      - ./observability/kibana-setup.sh:/setup/kibana-setup.sh:ro
      - ./observability/kibana/waslabid-usage.ndjson:/setup/waslabid-usage.ndjson:ro
    depends_on:
      kibana:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  clamav-db:
  caddy-data:
  caddy-config:
  elasticsearch-data:
