# Local development infrastructure for the tender-to-PO platform.
# The .NET app itself runs on the host (dotnet run / dotnet watch) for hot reload; everything it depends on runs here.
# Usage:  cp .env.example .env   then   docker compose up -d
# See docs/07-ways-of-working.md section 4 for ports, credentials, and the reset procedure.

name: erp-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: erp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_dev_password}
      POSTGRES_DB: platform
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: erp-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-erp}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-erp_dev_password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_FEATURES: organization
      KC_HEALTH_ENABLED: "true"
      # Substituted into keycloak/import/waslabid-realm.json and waslabid-platform-realm.json at import. Values live in
      # .env, never in the repository (N-10).
      WASLABID_WEB_CLIENT_SECRET: ${WASLABID_WEB_CLIENT_SECRET:?Set WASLABID_WEB_CLIENT_SECRET in infra/compose/.env}
      WASLABID_PLATFORM_CLIENT_SECRET: ${WASLABID_PLATFORM_CLIENT_SECRET:?Set WASLABID_PLATFORM_CLIENT_SECRET in infra/compose/.env}
      WASLABID_DEV_USER_PASSWORD: ${WASLABID_DEV_USER_PASSWORD:?Set WASLABID_DEV_USER_PASSWORD in infra/compose/.env}
      WASLABID_ADMIN_API_SECRET: ${WASLABID_ADMIN_API_SECRET:?Set WASLABID_ADMIN_API_SECRET in infra/compose/.env}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
      - "9000:9000"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The management port answers /health/ready; the image has no curl, so use bash's /dev/tcp trick.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO stopped publishing free images on quay.io and Docker Hub; Chainguard rebuilds it from source (MinIO
    # RELEASE.2026-09-22T19-25-18Z). Only its latest tag is free, so it is pinned by digest. It runs as root because
    # the image's non-root user cannot initialise the data directory ("file access denied"), as the old image did.
    image: cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    user: "0:0"
    container_name: erp-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-erp_dev_password}
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    # One-shot: creates the dev bucket and a least-privilege health-probe user (list-only, spec section 6), then exits.
    # The -dev variant carries the shell the entrypoint below needs.
    image: cgr.dev/chainguard/minio-client@sha256:fdb40d819ca51969c86fa76f45a67bb841759daf85d4c6ce9aa86d27f6e47ae9
    container_name: erp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-erp} ${MINIO_ROOT_PASSWORD:-erp_dev_password} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-erp-dev} &&
      mc admin user add local health-probe ${MINIO_HEALTH_PROBE_PASSWORD:?set MINIO_HEALTH_PROBE_PASSWORD in infra/compose/.env} &&
      printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::${STORAGE_BUCKET:-erp-dev}\"]}]}' > /tmp/health-probe-policy.json &&
      mc admin policy create local health-probe-read /tmp/health-probe-policy.json &&
      mc admin policy attach local health-probe-read --user health-probe &&
      echo 'bucket ready: ${STORAGE_BUCKET:-erp-dev}'"

  clamav:
    image: clamav/clamav:stable
    container_name: erp-clamav
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s   # first start downloads the signature database

  mailpit:
    # Catches all outgoing email; web UI shows Arabic and English messages as vendors would see them.
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    container_name: erp-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  caddy:
    # Edge for local development: terminates TLS for tenant hostnames and forwards to the app on the host.
    # Production uses the same image with on-demand TLS (see caddy/Caddyfile comments).
    image: caddy:2
    container_name: erp-caddy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  minio-data:
  clamav-db:
  caddy-data:
  caddy-config:
