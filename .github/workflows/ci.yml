# W-09: continuous integration. Three jobs run in parallel so a pull request reports within ten minutes:
#   build-test  restore, build with warnings as errors, format check, utility lint, tests (unit, bUnit, and
#               integration against real PostgreSQL, Keycloak, Mailpit and MinIO through Testcontainers)
#   docs        every Mermaid block in the Markdown documents renders
#   security    Elastic image signatures and the pilot deployment files (W-19: Compose config, Caddyfile, shellcheck),
#               then Trivy: repository scan and the pilot web image (both blocking), the Compose images (report only)
# spikes/ is not in WaslaBid.slnx, so no step builds or tests it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build, format, lint, test
    runs-on: ubuntu-latest
    # The integration suite takes about 16 minutes on a hosted runner since W-10 (1,200+ tests with Testcontainers).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      # SDK version and roll-forward come from global.json (10.0.401, latestFeature).
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Platform.UI downloads the pinned Tailwind standalone CLI into .tools/ during the build (no Node.js) and
      # checks its SHA-256 on every build, so a cached copy is still verified.
      - name: Cache Tailwind CLI
        uses: actions/cache@v6
        with:
          path: .tools
          key: tailwind-${{ runner.os }}-${{ hashFiles('src/UI/Platform.UI/Platform.UI.csproj') }}

      - name: Restore
        run: dotnet restore WaslaBid.slnx

      - name: Build (warnings as errors, includes the Tailwind build)
        run: dotnet build WaslaBid.slnx -warnaserror --no-restore

      - name: Format check
        run: dotnet format WaslaBid.slnx --verify-no-changes --no-restore

      # docs/08 section 4: physical direction utilities (ml-, pr-, text-left, ...) are banned. The lint is a unit
      # test class; it runs here on its own so a violation is named in the job log, and again in the full run below.
      - name: Logical-direction utility lint
        run: >
          dotnet test --project tests/Platform.UnitTests/Platform.UnitTests.csproj --no-build --no-progress
          --filter-class Platform.UnitTests.Styling.PhysicalUtilityLintTests

      # Microsoft.Testing.Platform runner (global.json). Integration tests start containers with Testcontainers;
      # the Ubuntu runner has Docker.
      - name: Test
        run: >
          dotnet test --solution WaslaBid.slnx --no-build --no-progress
          --results-directory "${{ github.workspace }}/TestResults"
          --report-xunit-trx

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: Mermaid render check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Puppeteer downloads headless Chrome into ~/.cache/puppeteer only when mermaid-cli is installed, so both folders
      # are cached together; caching ~/.npm alone restores mermaid-cli without its browser.
      - name: Cache npx packages and headless Chrome
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
          key: npm-mermaid-v2-${{ runner.os }}-${{ hashFiles('.github/scripts/check-mermaid.sh') }}

      - name: Render every Mermaid block
        run: bash .github/scripts/check-mermaid.sh

  security:
    name: Trivy scan
    runs-on: ubuntu-latest
    # 30: the repository scan, the pilot web image build (about 3 minutes), plus up to 15 for the Compose images
    # (Elasticsearch and Kibana are about 1.5 GB each).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Cache Trivy database
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # Blocking: Elastic signs its images with cosign (a published key, not keyless); every docker.elastic.co image
      # pinned in the Compose file must verify (W-10 follow-up, ADR-0014). Only registry metadata is fetched.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.0

      - name: Verify Elastic image signatures
        run: bash .github/scripts/verify-elastic-signatures.sh

      # Blocking (W-19): the pilot's Compose file resolves with every required setting present (throwaway values from
      # .env.example, never real secrets), the production Caddyfile is valid, and the deployment scripts pass shellcheck.
      - name: Validate the pilot deployment files
        run: |
          env_file="$RUNNER_TEMP/pilot.env"
          sed -E 's/^([A-Z_]+)=$/\1=ci-placeholder/' infra/pilot/.env.example > "$env_file"
          IMAGE_TAG=ci docker compose -f infra/pilot/docker-compose.yml --env-file "$env_file" \
            --profile tools --profile kibana config --quiet
          caddy_image=$(grep -E '^\s+image:\s+caddy:' infra/pilot/docker-compose.yml | awk '{print $2}')
          docker run --rm -v "$PWD/infra/pilot/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e ACME_EMAIL=ci@example.sa -e PLATFORM_HOST=platform.example.sa -e AUTH_HOST=auth.example.sa \
            -e TENANT_HOSTS=acme.example.sa -e ADMIN_ALLOW_CIDR=203.0.113.7/32 \
            "$caddy_image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          shellcheck -x -P infra/pilot infra/pilot/*.sh

      # Blocking: fixable HIGH and CRITICAL vulnerabilities in NuGet packages, committed secrets (N-10), and
      # misconfigurations. Settings are in .github/trivy.yaml, so the same scan runs locally.
      - name: Repository scan (dependencies, secrets, config)
        run: trivy fs --config .github/trivy.yaml .

      # Blocking (W-19): the image we build and ship to the pilot. The web host's image is scanned; the worker and the
      # migrator use the same base image and a subset of its packages.
      - name: Pilot web image scan
        run: |
          docker build -f infra/pilot/docker/app.Dockerfile --target web -t waslabid/web:ci .
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress waslabid/web:ci

      # Report only: third-party images from infra/compose (development) and infra/pilot (the pilot), not images we build.
      - name: Compose images scan (report only)
        continue-on-error: true
        # A slow pull of the large Elastic images ends this report-only step, not the job.
        timeout-minutes: 15
        run: |
          images=$(grep -hE '^\s+image:\s+[a-z]' infra/compose/docker-compose.yml infra/pilot/docker-compose.yml | awk '{print $2}' | sort -u)
          for image in $images; do
            echo "::group::$image"
            trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 0 --no-progress "$image"
            echo "::endgroup::"
          done
